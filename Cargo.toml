[workspace]
resolver = "2"
members = [
    "crates/spa-api",
    "crates/spa-core",
    "crates/providers/modrinth",
    "crates/providers/hangar",
    "crates/spa-app",
    "crates/spa-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Sparxilium"]

[workspace.dependencies]
spa-api = { path = "crates/spa-api" }
spa-core = { path = "crates/spa-core" }
spa-modrinth = { path = "crates/providers/modrinth" }
spa-hangar = { path = "crates/providers/hangar" }
spa-app = { path = "crates/spa-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
ureq = "2"
url = "2"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tempfile = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
