name: Build and pre-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test and package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-aarch64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libgtk-3-dev xvfb

      - name: Install latest stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup override set stable
          rustc --version
          cargo --version

      # The build scripts run fmt, Clippy, all tests and the release build with --locked, then
      # smoke-check the packaged executable and place it in dist/SmartPluginAssistant/.
      - name: Check, test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

      - name: Check, test and package (Linux)
        if: runner.os == 'Linux'
        # The smoke check creates the window, so it needs a (virtual) display.
        run: xvfb-run --auto-servernum bash ./build.sh

      - name: Check, test and package (macOS)
        if: runner.os == 'macOS'
        run: bash ./build.sh

      - name: Archive package and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "SmartPluginAssistant-${{ matrix.platform }}.zip"
          Compress-Archive -Path dist/SmartPluginAssistant -DestinationPath "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          # sha256sum format with LF, so `sha256sum --check` accepts it on Linux.
          [IO.File]::WriteAllText("$PWD/dist/$name.sha256", "$hash  $name`n")

      - name: Archive package and checksum (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          name="SmartPluginAssistant-${{ matrix.platform }}.tar.gz"
          tar -czf "dist/$name" -C dist SmartPluginAssistant
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi

      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smartpluginassistant-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish pre-release
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      RUN_NUMBER: ${{ github.run_number }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: smartpluginassistant-*
          path: release-assets
          merge-multiple: true

      - name: Verify packages and publish as pre-release
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          assets=(
            SmartPluginAssistant-windows-x86_64.zip
            SmartPluginAssistant-linux-x86_64.tar.gz
            SmartPluginAssistant-macos-aarch64.tar.gz
          )
          upload=()
          for asset in "${assets[@]}"; do
            test -f "$asset"
            sha256sum --check "$asset.sha256"
            upload+=("$asset" "$asset.sha256")
          done

          if [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          else
            tag="dev-${RUN_NUMBER}.${RUN_ATTEMPT}-${COMMIT_SHA:0:7}"
          fi
          {
            printf '%s\n\n' '> **開發階段，請勿用於正式環境。此版本為 Pre-release。**'
            printf '%s\n\n' '目前只有 Windows 在實際環境操作過；Linux 與 macOS 只經過 CI 建置、測試與啟動檢查，介面操作未實際驗證。'
            printf '%s\n\n' '本程式只管理伺服器的插件檔案，不會啟動或停止伺服器。被取代或移除的插件檔會移到伺服器目錄的 `.spa-backups/`，不會直接刪除。'
            printf '%s\n\n' 'Windows x86_64：解壓 ZIP 後執行 SmartPluginAssistant.exe。Linux x86_64：解壓 tar.gz 後執行 ./SmartPluginAssistant；需要圖形桌面與 fontconfig、xkbcommon、GTK 3 等系統函式庫。macOS（Apple Silicon）：解壓後執行 SmartPluginAssistant；執行檔未簽署，第一次需在「系統設定 › 隱私權與安全性」允許。詳見內附 README。'
            printf 'Commit: `%s`\n\n' "$COMMIT_SHA"
            printf '[Build log](%s)\n' "$RUN_URL"
          } > release-notes.md

          # A rerun may resume an incomplete draft; never overwrite a published release.
          if gh release view "$tag" --json isDraft --jq '.isDraft' > release-state.txt 2>/dev/null; then
            if [[ "$(cat release-state.txt)" != "true" ]]; then
              echo "Release $tag is already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$tag" --target "$COMMIT_SHA" \
              --title "SmartPluginAssistant $tag (Pre-release)" --notes-file release-notes.md \
              --draft --prerelease --latest=false
          fi
          gh release upload "$tag" "${upload[@]}" --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false
          printf 'Published **Pre-release**: [%s](https://github.com/%s/releases/tag/%s)\n' \
            "$tag" "$GH_REPO" "$tag" >> "$GITHUB_STEP_SUMMARY"
