name: Build and Package Cross-Platform

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os-name }} Package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            artifact-name: SmartPluginAssistant-Windows
            archive-file: SmartPluginAssistant-Windows.zip
          - os: ubuntu-latest
            os-name: Linux
            artifact-name: SmartPluginAssistant-Linux
            archive-file: SmartPluginAssistant-Linux.tar.gz
          - os: macos-latest
            os-name: macOS
            artifact-name: SmartPluginAssistant-macOS
            archive-file: SmartPluginAssistant-macOS.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build & Package (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call mvnw.cmd clean package -DskipTests
          call mvnw.cmd dependency:copy-dependencies -DoutputDirectory=target/lib
          copy target\SmartPluginAssistant-1.0.0-beta.jar target\lib\SmartPluginAssistant.jar
          if exist dist\SmartPluginAssistant rmdir /s /q dist\SmartPluginAssistant
          jpackage --type app-image --name "SmartPluginAssistant" --input "target/lib" --main-jar "SmartPluginAssistant.jar" --main-class "com.sparxilium.smartpluginassistant.Launcher" --java-options "--enable-native-access=javafx.graphics,com.sun.jna" --dest "dist"
          tar -a -c -f SmartPluginAssistant-Windows.zip -C dist SmartPluginAssistant

      - name: Build & Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests
          ./mvnw dependency:copy-dependencies -DoutputDirectory=target/lib
          cp target/SmartPluginAssistant-1.0.0-beta.jar target/lib/SmartPluginAssistant.jar
          rm -rf dist/SmartPluginAssistant
          jpackage --type app-image --name "SmartPluginAssistant" --input "target/lib" --main-jar "SmartPluginAssistant.jar" --main-class "com.sparxilium.smartpluginassistant.Launcher" --java-options "--enable-native-access=javafx.graphics,com.sun.jna" --dest "dist"
          tar -czvf SmartPluginAssistant-Linux.tar.gz -C dist SmartPluginAssistant

      - name: Build & Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests
          ./mvnw dependency:copy-dependencies -DoutputDirectory=target/lib
          cp target/SmartPluginAssistant-1.0.0-beta.jar target/lib/SmartPluginAssistant.jar
          rm -rf dist/SmartPluginAssistant
          jpackage --type app-image --name "SmartPluginAssistant" --input "target/lib" --main-jar "SmartPluginAssistant.jar" --main-class "com.sparxilium.smartpluginassistant.Launcher" --java-options "--enable-native-access=javafx.graphics,com.sun.jna" --dest "dist"
          cd dist
          zip -r ../SmartPluginAssistant-macOS.zip SmartPluginAssistant.app
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.archive-file }}
          if-no-files-found: error

  release:
    name: Create Pre-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release-assets/ \;
          ls -lh release-assets

      - name: Generate timestamp tag
        id: tag
        run: |
          TAG_NAME="pre-$(date +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Pre-release ${{ steps.tag.outputs.tag_name }}"
          body: |
            ## 🚀 Automated Pre-release
            - **Commit**: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - **Branch**: `${{ github.ref_name }}`
            - **Build Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
            
            ### 📦 Downloads:
            - **Windows**: `SmartPluginAssistant-Windows.zip`
            - **Linux**: `SmartPluginAssistant-Linux.tar.gz`
            - **macOS**: `SmartPluginAssistant-macOS.zip`
          prerelease: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
